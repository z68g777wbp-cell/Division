<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Teilen mit Rest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <nav id="levels" aria-label="Levels">
    <button class="level selected" data-level="1" aria-label="Level 1">1</button>
    <button class="level" data-level="2" aria-label="Level 2">2</button>
    <button class="level" data-level="3" aria-label="Level 3">3</button>
    <button class="level" data-level="4" aria-label="Level 4">4</button>
    <button id="leave" aria-label="Verlassen"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 5h23v38H8z M18 24h23m-8-8 8 8-8 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg></button>
  </nav>
  <section id="game">
    <div id="equation" class="equation">
      <span id="dividend">18</span><span>:</span><span id="divisor">5</span><span>=</span>
      <input id="quotient" class="answer" readonly aria-label="Ergebnis" tabindex="-1">
      <span id="restLabel" class="rest-label hidden">Rest</span><input id="remainder" class="answer small hidden" readonly aria-label="Rest" tabindex="-1">
    </div>
    <div id="productRow" class="product-row hidden">
      <span id="zLabel" class="hidden">z</span><input id="factor" class="answer small" readonly aria-label="Anzahl der Gruppen" tabindex="-1" disabled><span class="product-operator">·</span><span id="yLabel">5</span><span class="product-operator">=</span><input id="product" class="answer small" readonly aria-label="Produkt" tabindex="-1">
    </div>
    <div id="dots" aria-label="Punktedarstellung"></div>
    <div id="modeButtons" class="mode-buttons hidden">
      <button id="share" class="mode" aria-label="Teilen">
        <svg viewBox="0 0 100 80" aria-hidden="true"><g fill="currentColor"><path d="M50 3 36 29h28zM18 29 4 55h28zM82 29 68 55h28z"/></g><g stroke="currentColor" stroke-width="5"><path d="M50 29v40M18 55v14M82 55v14M33 70h34M1 70h34M65 70h34"/></g></svg>
      </button>
      <button id="measure" class="mode" aria-label="Messen">
        <svg viewBox="0 0 100 80" aria-hidden="true"><ellipse cx="50" cy="40" rx="36" ry="25" fill="none" stroke="currentColor" stroke-width="8"/><ellipse cx="50" cy="40" rx="25" ry="16" fill="none" stroke="currentColor" stroke-width="4"/></svg>
      </button>
    </div>
    <div id="palette" class="palette hidden" aria-label="Farbauswahl"></div>
    <div id="keypad" class="keypad" aria-label="Ziffernfeld">
      <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button>
      <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button>
      <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button>
      <button data-action="clear" aria-label="Löschen">⌫</button><button data-digit="0">0</button><button data-action="next" aria-label="Prüfen">✓</button>
    </div>
  </section>
  <section id="result" class="hidden">
    <div id="celebration" class="celebration hidden" aria-hidden="true"></div>
    <div id="score"></div><div id="time"></div>
    <button id="export" aria-label="Ergebnis exportieren">⇩</button>
    <button id="again" aria-label="Weiter">↻</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
